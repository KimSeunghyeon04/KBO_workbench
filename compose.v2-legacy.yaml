name: kbo-workbench-v2-legacy

services:
  db-v2:
    image: postgres:16-bookworm
    restart: "no"
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
    volumes:
      - postgres-data-v2:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${KBO_V2_DB_PORT:-5434}:5432"

volumes:
  postgres-data-v2:
    external: true
    name: "${KBO_V2_VOLUME_NAME:-kbo-workbench_postgres-data}"
